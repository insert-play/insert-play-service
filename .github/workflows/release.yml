name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # -- Check whether this version has already been released ------------------
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      already_released: ${{ steps.check.outputs.already_released }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version.txt
        id: read
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat version.txt | tr -d '[:space:]')"
          if gh release view "$TAG" &>/dev/null; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

  # -- Windows ----------------------------------------------------------------
  publish-windows:
    name: Publish (win-x64)
    needs: check-version
    if: needs.check-version.outputs.already_released == 'false'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download SDL2 native DLL
        run: powershell -ExecutionPolicy Bypass -File tools/get-sdl2-native.ps1

      - name: Publish (win-x64, framework-dependent)
        run: >
          dotnet publish src/InsertPlay.Service
          -c Release
          -r win-x64
          --self-contained false
          -o publish/win-x64

      - name: Create ZIP archive
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath insertplay-${{ needs.check-version.outputs.tag }}-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: insertplay-win-x64
          path: insertplay-${{ needs.check-version.outputs.tag }}-win-x64.zip

  # -- Linux ------------------------------------------------------------------
  publish-linux:
    name: Publish (linux-x64)
    needs: check-version
    if: needs.check-version.outputs.already_released == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install SDL2 system library
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Publish (linux-x64, framework-dependent)
        run: >
          dotnet publish src/InsertPlay.Service
          -c Release
          -r linux-x64
          --self-contained false
          -o publish/linux-x64

      - name: Bundle systemd unit
        run: cp deploy/insertplay.service publish/linux-x64/insertplay.service

      - name: Create tarball
        run: >
          tar -czf insertplay-${{ needs.check-version.outputs.tag }}-linux-x64.tar.gz
          -C publish/linux-x64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: insertplay-linux-x64
          path: insertplay-${{ needs.check-version.outputs.tag }}-linux-x64.tar.gz

  # -- GitHub Release ---------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [check-version, publish-windows, publish-linux]
    if: needs.check-version.outputs.already_released == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: insertplay-win-x64
          path: .

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: insertplay-linux-x64
          path: .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          VERSION="${{ needs.check-version.outputs.version }}"
          WIN_ZIP="insertplay-${TAG}-win-x64.zip"
          LIN_TGZ="insertplay-${TAG}-linux-x64.tar.gz"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          FLAGS=(--title "InsertPlay ${TAG}" --notes "$NOTES")
          [[ "$TAG" == *-* ]] && FLAGS+=(--prerelease)
          gh release create "$TAG" "${FLAGS[@]}" "$WIN_ZIP" "$LIN_TGZ"